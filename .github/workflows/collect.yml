name: Collect fuel prices

on:
  schedule:
    - cron: "30 1 * * *"   # 07:00 IST, after the 6 a.m. price change
  workflow_dispatch:        # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Fetch and append prices
        env:
          FUEL_PRICE_API_KEY: ${{ secrets.FUEL_PRICE_API_KEY }}
        run: python -m scripts.collector
      - name: Commit if changed
        run: |
          git config user.name "price-collector"
          git config user.email "actions@users.noreply.github.com"
          git add Data/live_prices.csv Data/daily_forecasts.csv
          git diff --staged --quiet || git commit -m "Update live prices $(date -u +%F)"
          git push
